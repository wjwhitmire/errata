name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -q --ignore=tests/test_browser.py

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: pip install -e .[dev]
      - run: python tests/fixtures/make_fixtures.py && python tests/fixtures/make_html_fixtures.py && cd tests/fixtures && python make_template_fixtures.py
      - run: python tests/make_vectors.py
      - name: fixtures, vectors and tables are up to date
        run: git diff --exit-code tests/vectors.json tests/fixtures/ web/src/core/90_tables.js web/src/core/91_example.js
      - run: node web/parity.test.mjs
      - run: node web/pdfjs.test.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: pip install -e .[dev] playwright
      - run: python -m playwright install --with-deps chromium
      - run: node web/net.test.mjs
      - run: node web/ai.test.mjs
      - run: python tools/check.py
      - run: python web/build_pages.py
      - name: the Pages build and the single-file app are up to date
        run: git diff --exit-code docs/ web/app.html
      - run: pytest -q tests/test_web.py tests/test_browser.py tests/test_published.py tests/test_build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: single-file-app
          path: web/app.html
