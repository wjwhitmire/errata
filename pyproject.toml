[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "errata"
version = "0.2.0"
description = "Local-first credit report review: parse reports, find errors with their legal basis, plan and write disputes, track deadlines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Will Whitmire" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
pdf = ["pdfminer.six>=20231228"]
dev = ["pytest", "pdfminer.six>=20231228", "reportlab>=4"]

[project.scripts]
errata = "errata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
